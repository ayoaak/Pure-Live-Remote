<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑直播间</title><style>body{font-family:system-ui;margin:0;background:#f5f6f8;color:#1d2129}main{max-width:820px;margin:32px auto;padding:0 18px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:8px}button,a{border:0;border-radius:8px;padding:9px 13px;background:#111827;color:#fff;text-decoration:none;cursor:pointer}.secondary{background:#475467}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class="panel"><h1>编辑直播间</h1><form method="post" action="/admin/rooms/{{ room.uuid }}/update"><div class="grid">
<label>主播名<input name="name" value="{{ room.name }}"></label><label>显示名称<input name="custom_name" value="{{ room.custom_name }}"></label><label>分组<input name="group_name" value="{{ room.group_name }}"></label><label>直播间 URL<input name="source_url" value="{{ room.source_url }}"></label><label>头像 URL<input name="avatar_url" value="{{ room.avatar_url }}"></label><label>当前直播封面 URL<input name="current_cover_url" value="{{ room.current_cover_url }}"></label><label>状态<select name="last_status">{% for status in ['live','offline','replay','unknown','banned'] %}<option value="{{ status }}" {% if room.last_status==status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label><label>播放模式<select name="play_mode">{% for mode in ['auto','redirect','proxy'] %}<option value="{{ mode }}" {% if room.play_mode==mode %}selected{% endif %}>{{ mode }}</option>{% endfor %}</select></label><label>偏好画质<input name="preferred_quality" value="{{ room.preferred_quality }}"></label><label>偏好线路<input name="preferred_line" value="{{ room.preferred_line }}"></label><label>排序<input name="sort_order" type="number" value="{{ room.sort_order }}"></label><label>启用<select name="enabled"><option value="1" {% if room.enabled %}selected{% endif %}>启用</option><option value="0" {% if not room.enabled %}selected{% endif %}>禁用</option></select></label>
</div><p><button type="submit">保存</button> <a class="secondary" href="/admin">返回</a></p></form></section></main></body></html>
